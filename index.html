<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no"
  />
  <title>Pickle Jump</title>
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>

  <!-- CODE ENTRY SCREEN -->
  <div id="gate">
    <div class="gate-box">
      <h1>Enter Code</h1>
      <input
        type="number"
        id="codeInput"
        placeholder="Enter code"
        inputmode="numeric"
      />
      <button id="codeButton">Unlock</button>
      <p id="gateError">Incorrect code</p>
    </div>
  </div>

  <!-- GAME -->
  <canvas id="game"></canvas>

  <script src="game.js?v=6"></script>
</body>
</html>
